[package]
name = "streaming-api"
version = "0.1.0"
edition = "2021"
description = "Atom native Qobuz/TIDAL provider protocol engine shared by Node Core and Rust tests."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "charset",
  "http2",
  "system-proxy",
  "rustls-tls-native-roots",
] }
urlencoding = "2"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util"] }
base64 = "0.22"
regex = "1"
napi = { workspace = true, features = ["napi9", "serde-json", "tokio_rt"] }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[lints]
workspace = true
