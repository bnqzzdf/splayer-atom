[package]
name = "audio-engine-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent SPlayer Atom audio engine core shared by native bindings."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# 音频解码 & 播放
ffmpeg_audio = { version = "0.3.1", default-features = false, features = [
  "http",
  "tracing",
] }
libc = "0.2"
parking_lot = "0.12"
diretta-sys = { path = "../diretta-sys", optional = true, features = ["sdk"] }

# 错误处理
anyhow = { workspace = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
once_cell = "1"

# DSP
signalsmith-stretch = "0.1.3"

# 元数据 & 缩略图
lofty = "0.24"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "bmp",
  "webp",
] }

# 文件遍历 & 文本编码识别
walkdir = "2"
encoding_rs = "0.8"
chardetng = "0.1"

# 日志（纯 Rust，无 NAPI）
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
time = { workspace = true }

# Linux Core 音频输出
alsa = "0.11.0"
alsa-sys = "0.4.0"

[features]
default = []
napi = []
diretta = ["dep:diretta-sys"]

[dev-dependencies]
base64 = "0.22.1"
httpmock = "0.8.3"
tempfile = "3"

[lints]
workspace = true
