name: Core System Gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  core-system-linux-x64:
    name: Core system artifact (Node 24.18.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup reference Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Setup reference Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Cache Core Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-system-linux-x64-rust-1.98.0

      - name: Install Core native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev pkg-config clang

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node and Web tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check Atom upstream touch inventory
        run: node scripts/atom/check-upstream-touch.mjs

      - name: Build and validate Core system artifact
        run: pnpm exec tsx scripts/atom/build-core-system.ts

      - name: Verify deployment surface in final tar
        run: |
          tar -tzf out/core-system-linux-x64.tar.gz | grep -Fx core-system/docs/core-deployment.md
          tar -tzf out/core-system-linux-x64.tar.gz | grep -Fx core-system/service/install-systemd.sh
          tar -tzf out/core-system-linux-x64.tar.gz | grep -Fx core-system/service/splayer-atom-core.service
          test -x out/core-system/service/install-systemd.sh
          test -x out/core-system/bin/splayer-atom-core

      - name: Whitespace check
        run: git diff --check
