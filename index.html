<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/icon" href="/icons/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/favicon-192x192.png" />
    <link rel="preload" href="/fonts/logo.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>SPlayer Atom</title>
    <style>
      @font-face {
        font-family: "logo";
        src: url("/fonts/logo.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background: #101014;
      }
      html.light body {
        background: #f6f6f6;
      }
    </style>
    <script>
      // 确定明暗模式
      (function () {
        let mode = "system";
        try {
          const raw = localStorage.getItem("theme");
          if (raw) mode = JSON.parse(raw).mode || "system";
        } catch (e) {}
        const isDark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (!isDark) document.documentElement.classList.add("light");
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
